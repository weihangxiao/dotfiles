# Based on kunchenguid/dotfiles (herdr config), customized keys
# Prefix is Ctrl+A (press Ctrl+A twice to send a literal Ctrl+A)
unbind C-b
set -g prefix C-a
bind C-a send-prefix

# --- Terminal / colors ---
set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",xterm-ghostty:RGB"
set -sg escape-time 10       # snappy Esc (nvim maps Esc to save)
set -g focus-events on

# --- Behavior ---
set -g mouse on              # scroll, click panes, drag borders
set -g history-limit 50000
set -g base-index 1          # windows start at 1, matches Cmd+1..9 habit
setw -g pane-base-index 1
set -g renumber-windows on
setw -g mode-keys vi

# --- Keys ---
# Focus panes with Ctrl+hjkl (repeatable; arrow keys also work)
bind -r C-h select-pane -L
bind -r C-j select-pane -D
bind -r C-k select-pane -U
bind -r C-l select-pane -R
# Splits: v = side by side, h = stacked; open in the current directory
unbind '"'
unbind %
bind v split-window -h -c "#{pane_current_path}"
bind h split-window -v -c "#{pane_current_path}"
bind c   new-window -c "#{pane_current_path}"
# Copy mode on y; v to select, y to copy (to macOS clipboard)
bind y copy-mode
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send -X copy-pipe-and-cancel "pbcopy"
# Reload this file
bind r source-file ~/.config/tmux/tmux.conf \; display "tmux config reloaded"

# --- Rosé Pine Moon theme (transparent bg to keep Ghostty blur) ---
set -g status-position top
set -g status-style "bg=default,fg=#908caa"
set -g status-left "#[fg=#c4a7e7,bold] #S #[default]"
set -g status-left-length 30
set -g status-right "#[fg=#6e6a86]%H:%M "
setw -g window-status-format "#[fg=#6e6a86] #I:#W "
setw -g window-status-current-format "#[fg=#232136,bg=#c4a7e7,bold] #I:#W "
set -g pane-border-style "fg=#393552"
set -g pane-active-border-style "fg=#c4a7e7"
# Make the active pane obvious: dim inactive text, label each pane on top
set -g window-style "fg=#6e6a86"
set -g window-active-style "fg=#e0def4"
set -g pane-border-status top
set -g pane-border-format "#{?pane_active,#[fg=#232136#,bg=#c4a7e7#,bold],#[fg=#6e6a86]} #{pane_index}: #{pane_current_command} "
set -g pane-border-lines heavy
set -g message-style "bg=#2a273f,fg=#e0def4"
setw -g mode-style "bg=#393552,fg=#e0def4"

# --- Plugins (TPM: prefix + I to install, prefix + U to update) ---
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-resurrect'   # prefix + Ctrl+S save, prefix + Ctrl+R restore
set -g @plugin 'tmux-plugins/tmux-continuum'   # auto-save every 15 min, auto-restore on start
set -g @resurrect-capture-pane-contents 'on'
set -g @continuum-restore 'on'

# Keep this line at the very bottom
run '~/.config/tmux/plugins/tpm/tpm'
